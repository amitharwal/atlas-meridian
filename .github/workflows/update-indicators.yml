# Refreshes the World Bank figures once a month and commits them if anything changed.
# (The UN speeches can't be fetched automatically; they're updated by hand once a year.)
name: Update indicators

on:
  schedule:
    - cron: '0 6 3 * *' # 06:00 UTC on the 3rd of every month
  workflow_dispatch: # also allows a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python pipeline/build_indicators.py
      - name: Commit if the data changed
        run: |
          if git diff --quiet -- public/data/indicators; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/data/indicators
          git commit -m "Update World Bank indicators"
          git push
