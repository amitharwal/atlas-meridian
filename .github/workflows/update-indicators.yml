# Refreshes the World Bank figures once a month and commits them if anything changed.
# (The UN speeches can't be fetched automatically; they're updated by hand once a year.)
name: Update indicators

on:
  schedule:
    - cron: '0 6 3 * *' # 06:00 UTC on the 3rd of every month
  workflow_dispatch: # also allows a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python pipeline/build_indicators.py
      # Check the new figures before keeping them; a failed check stops here,
      # so nothing is committed and GitHub emails the repository owner.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Commit if the data changed
        run: |
          # New files (a country appearing for the first time) count as changes too.
          if git diff --quiet -- public/data && [ -z "$(git ls-files --others --exclude-standard public/data)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/data/indicators public/data/stats public/data/regions.json
          git commit -m "Update World Bank indicators"
          git push
