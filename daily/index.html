<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess the Country · Daily map game · Atlas Meridian</title>
    <meta name="description" content="One country is highlighted on the world map. Can you name it? Five rounds a day, from easy to hard." />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{site}}daily/" />
    <meta property="og:title" content="Guess the Country · Atlas Meridian" />
    <meta property="og:description" content="One country is highlighted on the world map. Can you name it? Five rounds a day, from easy to hard." />
    <meta property="og:image" content="{{site}}og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="../data/countries.topo.json" as="fetch" crossorigin />
    <link rel="preload" href="../data/game.json" as="fetch" crossorigin />
  </head>
  <body>
    <header class="site-nav is-static" data-page="daily"></header>
    <main class="game">
      <div class="game-head">
        <p id="kicker" class="kicker">Daily game</p>
        <h1>Guess the Country</h1>
        <ol id="progress" class="progress" aria-label="Rounds"></ol>
      </div>
      <div class="map-wrap">
        <div id="map" class="game-map" role="img" aria-label="World map with one country highlighted"></div>
        <p id="map-status" class="map-status" role="status">Loading the map…</p>
      </div>
      <section id="panel" class="panel" aria-live="polite"></section>
    </main>
    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="/src/daily.js"></script>
  </body>
</html>
